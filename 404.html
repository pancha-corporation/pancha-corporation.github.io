<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 — Pancha Corporation</title>
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" type="image/webp" href="/avatar2.webp" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #010205;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }
        .err-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            text-align: center;
            max-width: 440px;
            width: 100%;
            margin: auto;
        }
        .err-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            background: #0d0d0d;
            display: block;
        }
        .err-title {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .err-code {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
            color: #ffffff;
        }
        .err-desc {
            font-size: 1rem;
            color: #8a8a8a;
            line-height: 1.55;
            font-weight: 400;
        }
        .timer-circle {
            position: relative;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            margin-top: 1rem;
        }
        .timer-circle svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .timer-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 6;
        }
        .timer-progress {
            fill: none;
            stroke: #ffffff;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        .timer-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            z-index: 1;
        }
        .timer-circle::after {
            content: attr(data-tooltip);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            color: #8a8a8a;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            width: max-content;
            max-width: 280px;
            text-align: center;
            line-height: 1.4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            will-change: opacity;
        }
        .timer-circle:hover::after {
            opacity: 1;
        }
        @media (max-width: 480px) {
            .err-avatar {
                width: 76px;
                height: 76px;
            }
            .err-title {
                font-size: 1.2rem;
            }
            .err-code {
                font-size: 2.6rem;
            }
            .err-desc {
                font-size: 0.92rem;
            }
            .timer-circle {
                width: 56px;
                height: 56px;
            }
            .timer-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="err-wrap">
        <img src="/avatar2.webp" alt="Pancha" class="err-avatar" onerror="this.style.display='none';">
        <div class="err-title">Pancha corporation</div>
        <div class="err-code">404</div>
        <div class="err-desc" id="errDesc">Page not found.</div>
        <div class="timer-circle" id="timerCircle">
            <svg viewBox="0 0 100 100">
                <circle class="timer-bg" cx="50" cy="50" r="45" />
                <circle class="timer-progress" cx="50" cy="50" r="45" />
            </svg>
            <span class="timer-text" id="timerText">10</span>
        </div>
    </div>

    <script>
        (function () {
            const lang = localStorage.getItem('lang') || 'en';
            const texts = {
                en: {
                    desc: 'Page not found.',
                    redirectTooltip: 'You will be redirected to the main page automatically in {s} seconds'
                },
                ru: {
                    desc: 'Страница не найдена.',
                    redirectTooltip: 'Вы будете перенаправлены на главную страницу автоматически через {s} секунд'
                }
            };
            const t = texts[lang] || texts.en;
            document.getElementById('errDesc').textContent = t.desc;
            document.documentElement.lang = lang;

            const timerCircle = document.getElementById('timerCircle');
            const timerProgress = document.querySelector('.timer-progress');
            const timerText = document.getElementById('timerText');
            let timeLeft = 10;
            const totalTime = 10;
            const circumference = 2 * Math.PI * 45;

            function updateTooltip() {
                timerCircle.setAttribute('data-tooltip', t.redirectTooltip.replace('{s}', timeLeft));
            }
            
            updateTooltip();
            timerText.textContent = timeLeft;
            timerProgress.style.strokeDashoffset = 0;

            const interval = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(interval);
                    window.location.href = '/';
                    return;
                }
                timerText.textContent = timeLeft;
                updateTooltip();
                const offset = circumference - (timeLeft / totalTime) * circumference;
                timerProgress.style.strokeDashoffset = offset;
            }, 1000);
        })();
    </script>
</body>
</html>
