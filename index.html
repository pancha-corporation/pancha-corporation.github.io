</head>
<body>
    <header class="home-navbar">
        <a href="/" class="home-logo">Pancha corporation</a>
        <a href="panel/" class="home-panel-link" data-i18n="panelLink">Panel →</a>
    </header>

    <div id="page-home" class="home-panel">
        <div class="home-left">
            <div class="home-big">
                <span class="line">Pancha</span>

            <a href="panel/#contact" data-i18n="contact">Contact</a>
        </div>
    </footer>

    <script src="translations.js"></script>
    <script>
        (function () {
            function applyHomeLanguage() {
                const lang = localStorage.getItem('lang') || 'en';
                const t = translations[lang] || translations.en;
                document.documentElement.lang = lang;

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (t[key] !== undefined) el.textContent = t[key];
                });
            }

            applyHomeLanguage();
            document.addEventListener('DOMContentLoaded', applyHomeLanguage);

            window.addEventListener('storage', (e) => {
                if (e.key === 'lang' || e.key === null) applyHomeLanguage();
            });

            window.addEventListener('pageshow', () => applyHomeLanguage());

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) applyHomeLanguage();
            });

            setInterval(applyHomeLanguage, 500);
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
